<title>Gonçalo L. Fernandes - AI/ML Developer</title>
<meta name="description" content="AI/ML Developer in Porto. Production document intelligence, computer vision and LLM orchestration on Azure.">
<meta name="theme-color" content="#0B0D12">
<meta property="og:title" content="Gonçalo L. Fernandes - AI/ML Developer">
<meta property="og:description" content="Production document intelligence, computer vision and LLM orchestration on Azure.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ltarkker.github.io/">

<script>
/* Aplicar o tema antes do CSS para evitar flash */
(function(){
  var t;
  try { t = localStorage.getItem("theme"); } catch (e) { t = null; }
  if (t !== "light" && t !== "dark") {
    t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  }
  document.documentElement.dataset.theme = t;
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B0D12'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%238FA0FF' stroke-width='3'/%3E%3C/svg%3E">

<style>
/* ==========================================================================
   TOKENS
   Uma paleta unica: tinta, papel e um gradiente de acento (periwinkle
   para agua). Dois temas. O fundo nunca muda ao scroll.
   ========================================================================== */
:root{
  --bg:#0B0D12;
  --soft:#10131B;
  --card:rgba(255,255,255,.04);
  --line:rgba(255,255,255,.08);
  --line2:rgba(255,255,255,.15);
  --tx:#E9ECF4;
  --mut:#A6ADC0;
  --mut2:#6F7789;
  --a1:#8FA0FF;
  --a2:#6EE7D8;
  --on-a:#0B0D12;
  --glow1:rgba(143,160,255,.30);
  --glow2:rgba(110,231,216,.22);
  --shadow:none;
  --shadow-lift:0 18px 40px -24px rgba(0,0,0,.7);

  --disp:"Bricolage Grotesque","Figtree","Segoe UI",sans-serif;
  --sans:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;

  --grad:linear-gradient(110deg,var(--a1),var(--a2));
  --shell:1200px;
  --gut:clamp(20px,5vw,68px);
  --r:18px;
  --r-s:12px;
  --ease:cubic-bezier(.16,1,.3,1);
}
html[data-theme="light"]{
  --bg:#F7F8FC;
  --soft:#FFFFFF;
  --card:#FFFFFF;
  --line:#E7EAF3;
  --line2:#D8DDEA;
  --tx:#14161D;
  --mut:#545C70;
  --mut2:#8B93A7;
  --a1:#4D66E8;
  --a2:#0B8A82;
  --on-a:#FFFFFF;
  --glow1:rgba(77,102,232,.14);
  --glow2:rgba(11,138,130,.12);
  --shadow:0 10px 30px -18px rgba(23,30,60,.18);
  --shadow-lift:0 22px 44px -22px rgba(23,30,60,.28);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--tx);
  font-family:var(--sans);
  font-size:clamp(15px,1.02vw,16.5px);
  line-height:1.62;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  transition:background-color .45s ease,color .45s ease;
}
body.is-locked{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
img,svg{display:block;max-width:100%}
::selection{background:var(--a1);color:var(--on-a)}
:focus-visible{outline:2px solid var(--a1);outline-offset:3px;border-radius:6px}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
html{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}

.shell{width:100%;max-width:var(--shell);margin-inline:auto;padding-inline:var(--gut)}

/* Grao de filme muito subtil, so no tema escuro */
.grain{
  position:fixed;inset:0;z-index:1000;pointer-events:none;opacity:.05;mix-blend-mode:soft-light;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.6'/></svg>");
}
html[data-theme="light"] .grain{display:none}

/* ==========================================================================
   TIPOGRAFIA
   ========================================================================== */
.display{
  font-family:var(--disp);font-weight:700;
  font-size:clamp(44px,8.2vw,110px);line-height:.96;letter-spacing:-.03em;margin:0;
}
h2{
  font-family:var(--disp);font-weight:650;
  font-size:clamp(28px,4.4vw,54px);line-height:1.04;letter-spacing:-.025em;
  margin:0 0 clamp(16px,2vw,24px);position:relative;padding-bottom:18px;
}
h2::after{
  content:"";position:absolute;left:0;bottom:0;width:56px;height:3px;border-radius:3px;
  background:var(--grad);transform:scaleX(0);transform-origin:left;
  transition:transform .8s var(--ease) .25s;
}
h2.is-in::after{transform:scaleX(1)}
h3{margin:0;font-family:var(--disp);font-weight:600;letter-spacing:-.015em}
.eyebrow{
  font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--mut2);display:flex;align-items:center;gap:10px;margin:0 0 clamp(14px,1.8vw,20px);
}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--grad)}
.lede{font-size:clamp(16px,1.7vw,20px);line-height:1.5;color:var(--mut);max-width:58ch;margin:0 0 clamp(26px,3.4vw,44px)}
.gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* Revelacao por palavra ou letra com mascara */
.w{display:inline-block;overflow:hidden;vertical-align:top}
.w > i{display:inline-block;font-style:inherit;transform:translateY(112%);transition:transform .8s var(--ease);transition-delay:calc(var(--n) * 36ms)}
.is-in .w > i{transform:none}
.up{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:calc(var(--n,0) * 60ms)}
.is-in .up,.up.is-in{opacity:1;transform:none}

/* Foco de luz que segue o cursor nos cartoes (so desktop) */
.glow{position:relative}
.glow::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),var(--glow1),transparent 55%);
  opacity:0;transition:opacity .35s;
}
.glow:hover::before{opacity:1}
.glow > *{position:relative;z-index:1}

/* ==========================================================================
   CHROME
   ========================================================================== */
.prog{position:fixed;top:0;left:0;right:0;height:2px;z-index:90}
.prog i{display:block;height:100%;width:0;background:var(--grad)}

.bar{
  position:fixed;top:0;left:0;right:0;z-index:80;
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  transition:transform .38s var(--ease),background-color .45s ease;
}
.bar.is-hid{transform:translateY(-100%)}
.bar__in{display:flex;align-items:center;gap:14px;height:62px}
.mark{font-family:var(--disp);font-weight:650;font-size:14.5px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.mark i{width:8px;height:8px;border-radius:50%;background:var(--grad);flex:none}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.tbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:36px;min-width:36px;padding:0 10px;border:1px solid var(--line2);border-radius:999px;
  font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.1em;color:var(--mut);
  transition:.2s;
}
.tbtn:hover{color:var(--tx);border-color:var(--a1);background:color-mix(in srgb,var(--a1) 8%,transparent)}
.tbtn svg{width:15px;height:15px}
html[data-theme="dark"] .ic-moon{display:none}
html[data-theme="light"] .ic-sun{display:none}
.lang{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.lang button{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.1em;padding:9px 11px;color:var(--mut2);transition:.2s}
.lang button[aria-pressed="true"]{background:var(--grad);color:var(--on-a);font-weight:600}
.only-lg{display:none}
@media(min-width:900px){.only-lg{display:inline-flex}}

.railnav{position:fixed;right:clamp(14px,1.8vw,26px);top:50%;transform:translateY(-50%);z-index:60;display:none;flex-direction:column;gap:12px}
@media(min-width:1180px){.railnav{display:flex}}
.railnav button{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.railnav i{display:block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line2);transition:.28s var(--ease)}
.railnav span{
  font-family:var(--mono);font-weight:500;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mut);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 10px;
  opacity:0;transform:translateX(6px);transition:.28s var(--ease);box-shadow:var(--shadow);
}
.railnav button:hover i{border-color:var(--a1)}
.railnav button:hover span{opacity:1;transform:none}
.railnav button[aria-current="true"] i{background:var(--grad);border-color:transparent;transform:scale(1.35)}

/* ==========================================================================
   BOTÕES E CONTROLOS
   ========================================================================== */
.btn{
  display:inline-flex;align-items:center;gap:9px;
  font-family:var(--sans);font-weight:600;font-size:14px;letter-spacing:.005em;
  padding:13px 22px;border:1px solid var(--line2);border-radius:999px;color:var(--tx);
  transition:background-color .22s,color .22s,border-color .22s,box-shadow .22s;
  will-change:transform;
}
.btn:hover{border-color:var(--a1);background:color-mix(in srgb,var(--a1) 9%,transparent)}
.btn--fill{background:var(--grad);color:var(--on-a);border-color:transparent}
.btn--fill:hover{box-shadow:var(--shadow-lift);background:var(--grad)}
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
.seg button{padding:8px 14px;border-radius:999px;font-family:var(--sans);font-weight:500;font-size:13px;color:var(--mut);transition:.2s}
.seg button:hover{color:var(--tx)}
.seg button[aria-pressed="true"]{background:var(--grad);color:var(--on-a);font-weight:600}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:clamp(18px,2.4vw,28px)}
.ctrl__l{font-family:var(--mono);font-weight:500;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut2);width:100%}
.sliderwrap{
  display:inline-flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:999px;
  padding:9px 16px;background:var(--card);box-shadow:var(--shadow);
  font-family:var(--sans);font-weight:500;font-size:13px;color:var(--mut);
}
.sliderwrap output{font-family:var(--mono);font-weight:600;color:var(--tx);font-variant-numeric:tabular-nums;min-width:36px}
.slider{-webkit-appearance:none;appearance:none;width:150px;height:4px;border-radius:99px;background:var(--line2);outline:none;cursor:pointer}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--a1);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--a1);cursor:pointer}
.slider::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--a1);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--a1);cursor:pointer}

/* ==========================================================================
   SECÇÕES
   ========================================================================== */
.sec{padding-block:clamp(84px,11vw,150px);position:relative}
.sec--tall{min-height:92svh;display:flex;flex-direction:column;justify-content:center}

/* ---- HERO ---- */
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding-top:100px;padding-bottom:76px;position:relative;overflow:hidden}
.aurora{position:absolute;inset:-30% -20%;pointer-events:none;filter:blur(90px)}
.aurora i{position:absolute;border-radius:50%}
.aurora .b1{width:56vw;height:56vw;min-width:420px;min-height:420px;left:-10%;top:-14%;background:radial-gradient(circle at 35% 35%,var(--glow1),transparent 62%);animation:drift1 26s ease-in-out infinite}
.aurora .b2{width:46vw;height:46vw;min-width:360px;min-height:360px;right:-8%;bottom:-18%;background:radial-gradient(circle at 60% 45%,var(--glow2),transparent 60%);animation:drift2 32s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,9%) scale(1.12)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-7%,-8%) scale(1.08)}}
.aurora--soft{filter:blur(110px);opacity:.6}
.hero__in{position:relative;z-index:1}
.hero__meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 clamp(24px,3.2vw,42px)}
.hero__meta span{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:7px 13px;background:var(--card);box-shadow:var(--shadow);
}
.hero__meta span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--grad);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hero__name em{font-style:normal;display:block}
.hero__lede{font-size:clamp(18px,2.2vw,26px);line-height:1.42;color:var(--mut);max-width:30ch;margin:clamp(22px,3vw,36px) 0 clamp(26px,3.4vw,42px);font-weight:500}
.hero__lede .gt{font-weight:700}
.rot{display:inline-flex;overflow:hidden;height:1.34em;vertical-align:bottom}
.rot i{display:inline-block;font-style:normal;white-space:nowrap;transition:transform .42s var(--ease),opacity .42s var(--ease)}
.rot i.is-out{transform:translateY(-115%);opacity:0}
.rot i.is-prep{transform:translateY(115%);opacity:0;transition:none}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.cue{position:absolute;left:var(--gut);bottom:26px;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-weight:500;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut2);z-index:1}
.cue i{display:block;width:1px;height:30px;background:var(--mut2);animation:drop 2s var(--ease) infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ---- MARQUEE ---- */
.mq{
  overflow:hidden;padding:18px 0;border-block:1px solid var(--line);
  mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
}
.mq__t{display:flex;width:max-content;animation:mq 44s linear infinite}
.mq:hover .mq__t{animation-play-state:paused}
.mq__t span{
  display:flex;align-items:center;gap:40px;padding-right:40px;white-space:nowrap;
  font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut2);
}
.mq__t span::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--a1);opacity:.6}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---- NÚMEROS ---- */
.nums{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(min-width:900px){.nums{grid-template-columns:repeat(4,1fr)}}
.num{
  border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);
  padding:clamp(18px,2.4vw,28px);transition:border-color .25s,transform .25s var(--ease),box-shadow .25s;
}
.num:hover{border-color:color-mix(in srgb,var(--a1) 40%,var(--line));transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.num__n{font-family:var(--disp);font-weight:700;font-size:clamp(34px,4.6vw,62px);line-height:.95;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.num__l{font-size:13.5px;line-height:1.45;color:var(--mut);margin-top:12px}
.num__s{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2);margin-top:10px}

/* ==========================================================================
   LABORATÓRIOS
   ========================================================================== */
.lab{display:grid;gap:clamp(14px,2vw,24px);align-items:start}
@media(min-width:1020px){.lab{grid-template-columns:1.02fr .98fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.panel__h{
  display:flex;align-items:center;gap:9px;padding:13px 18px;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut2);
}
.panel__h::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--grad)}
.panel__h b{color:var(--tx);font-weight:500}
.panel__h span{margin-left:auto}
.panel__b{padding:clamp(14px,2vw,22px)}

/* documento sintetico */
.docx{position:relative;overflow:hidden}
.docx__t{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid var(--line2);padding-bottom:11px;margin-bottom:6px}
.docx__t b{font-family:var(--disp);font-weight:650;font-size:clamp(15px,1.9vw,21px);letter-spacing:-.01em}
.docx__t span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--mut2)}
.drow{display:grid;grid-template-columns:minmax(86px,32%) 1fr;gap:8px 14px;padding:8px 0;border-bottom:1px solid var(--line);font-size:clamp(12.5px,1.3vw,14.5px)}
.drow:last-child{border-bottom:0}
.drow--sum{border-bottom:2px solid var(--line2);margin-top:6px}
.drow__k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);align-self:center}
.drow__v{font-weight:600}
.dv{position:relative;display:inline;border-radius:4px;transition:background-color .2s}
.dv.is-lit{background:color-mix(in srgb,var(--a1) 18%,transparent)}
.scan{position:absolute;left:0;right:0;top:0;height:2px;background:var(--grad);opacity:0;pointer-events:none;z-index:3;border-radius:2px}
.scan.is-on{animation:sweep 1.05s var(--ease) forwards}
@keyframes sweep{0%{opacity:.95;top:0}92%{opacity:.95}100%{opacity:0;top:100%}}
.bbox{
  position:absolute;pointer-events:none;border:1.5px solid var(--a1);border-radius:5px;
  background:color-mix(in srgb,var(--a1) 8%,transparent);
  opacity:0;transform:scale(.985);transform-origin:0 0;
  transition:opacity .38s var(--ease),transform .38s var(--ease),box-shadow .18s;z-index:2;
}
.bbox.is-in{opacity:1;transform:none}
.bbox.is-lit{box-shadow:0 0 0 3px color-mix(in srgb,var(--a1) 28%,transparent)}
.bbox__tag{
  position:absolute;left:-1.5px;top:-1.5px;transform:translateY(-100%);
  background:var(--a1);color:var(--on-a);border-radius:5px 5px 5px 0;
  font-family:var(--mono);font-weight:600;font-size:8.5px;letter-spacing:.05em;padding:2.5px 6px;white-space:nowrap;
}

/* pipeline + json */
.stages{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.stage{
  font-family:var(--mono);font-weight:500;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--mut2);
  opacity:.5;transition:.28s var(--ease);
}
.stage.is-on{opacity:1;background:var(--grad);color:var(--on-a);border-color:transparent;font-weight:600}
.route{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;line-height:1.7;color:var(--mut);
  padding:11px 14px;background:color-mix(in srgb,var(--a1) 7%,transparent);
  border-left:2px solid var(--a1);border-radius:0 10px 10px 0;margin-bottom:14px;
  opacity:0;transition:opacity .5s var(--ease);
}
.route.is-on{opacity:1}
.route b{color:var(--a1);font-weight:600}
.json{font-family:var(--mono);font-size:clamp(11px,1.05vw,12.5px);line-height:1.6}
.jdim{color:var(--mut2)}
.jline{
  display:flex;flex-wrap:wrap;gap:0 10px;align-items:baseline;padding:5px 8px 5px 15px;border-radius:8px;
  opacity:0;transform:translateX(-8px);
  transition:opacity .4s var(--ease),transform .4s var(--ease),background-color .16s;
}
.jline.is-in{opacity:1;transform:none}
.jline.is-lit{background:color-mix(in srgb,var(--a1) 10%,transparent)}
.jkey{color:var(--a1);font-weight:600}
.jconf{margin-left:auto;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;color:var(--mut2)}
.jbar{width:42px;height:3px;border-radius:99px;background:var(--line2);overflow:hidden}
.jbar i{display:block;height:100%;width:0;background:var(--grad);transition:width .8s var(--ease) .15s}
.jline.is-in .jbar i{width:var(--w)}
.tally{
  display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);
  opacity:0;transition:opacity .5s var(--ease);
}
.tally.is-on{opacity:1}
.tally b{color:var(--a1);font-weight:600}

/* estante / deteccao */
.rack{display:grid;gap:5px}
.lvl{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:stretch}
.lvl__k{font-family:var(--mono);font-weight:500;font-size:9px;letter-spacing:.1em;color:var(--mut2);align-self:center;width:16px}
.bins{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.bin{position:relative;height:clamp(40px,5.4vw,58px);border:1px solid var(--line2);border-radius:8px;display:flex;gap:2px;padding:3px;background:var(--card)}
.det{
  position:relative;border:1.5px solid var(--a1);border-radius:5px;
  background:color-mix(in srgb,var(--a1) 13%,transparent);
  opacity:0;transform:scale(.9);transition:opacity .3s var(--ease),transform .3s var(--ease),background-color .18s;cursor:crosshair;
}
.det--thin{border-width:1px}
.det--dot{border-style:dotted;border-width:2px}
.det--empty{border-style:dashed;background:transparent}
.det.is-on{opacity:1;transform:none}
.det--empty.is-on{opacity:.45}
.det.is-off{opacity:0;transform:scale(.9);pointer-events:none}
.det:hover{background:color-mix(in srgb,var(--a1) 32%,transparent)}
.readout{font-family:var(--mono);font-size:11px;letter-spacing:.04em;line-height:1.75;color:var(--mut)}
.readout__r{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.readout__r:last-child{border-bottom:0}
.readout__r span:last-child{margin-left:auto;font-weight:600;color:var(--tx)}
.readout__r b{color:var(--a1);font-weight:600}
.hint{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2);margin:12px 0 0;min-height:1.4em}
.fills{display:grid;gap:5px;margin-top:14px}
.fillrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--mut2)}
.fillrow__b{height:6px;border-radius:99px;background:var(--line2);position:relative;overflow:hidden}
.fillrow__b i{display:block;height:100%;width:0;background:var(--grad);transition:width .5s var(--ease);border-radius:99px}
.fillrow__s{text-transform:uppercase;min-width:92px;text-align:right}
.fillrow.is-alert .fillrow__s{color:var(--a1);font-weight:600}

/* ==========================================================================
   TRABALHO
   ========================================================================== */
.rows{border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.row{border-bottom:1px solid var(--line);position:relative}
.row:last-child{border-bottom:0}
.row::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad);
  transform:scaleY(0);transform-origin:top;transition:transform .38s var(--ease);
}
.row:hover::before,.row.is-open::before{transform:scaleY(1)}
.row__hd{
  width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:14px clamp(16px,2.4vw,30px);align-items:center;
  padding:clamp(20px,2.6vw,30px) clamp(16px,2.4vw,28px);
  transition:background-color .25s;
}
.row__hd:hover{background:color-mix(in srgb,var(--a1) 5%,transparent)}
.row.is-open .row__hd{background:color-mix(in srgb,var(--a1) 7%,transparent)}
.row__n{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.1em;color:var(--mut2);align-self:start;padding-top:6px}
.row__tag{display:block;font-family:var(--mono);font-weight:500;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--a1);margin-bottom:8px}
.row__t{display:block;font-family:var(--disp);font-weight:650;font-size:clamp(19px,2.8vw,32px);line-height:1.08;letter-spacing:-.02em}
.row__s{display:block;margin-top:8px;font-size:clamp(13px,1.4vw,15px);color:var(--mut);max-width:54ch}
.row__x{
  width:34px;height:34px;border:1px solid var(--line2);border-radius:50%;display:grid;place-items:center;flex:none;
  color:var(--mut);transition:transform .32s var(--ease),border-color .25s,color .25s;
}
.row:hover .row__x{border-color:var(--a1);color:var(--a1)}
.row.is-open .row__x{transform:rotate(45deg);border-color:var(--a1);color:var(--a1)}
.row__more{max-height:0;overflow:hidden;transition:max-height .55s var(--ease)}
.row__inner{padding:clamp(18px,2.6vw,32px) clamp(16px,2.4vw,28px) clamp(26px,3.4vw,42px);display:grid;gap:clamp(20px,2.8vw,40px)}
@media(min-width:960px){.row__inner{grid-template-columns:1fr 1fr}}
.case{display:grid;gap:16px}
.case__b{position:relative;padding-left:16px}
.case__b::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:2px;border-radius:2px;background:var(--line2)}
.case__b--win::before{background:var(--grad)}
.case__b h4{margin:0 0 6px;font-family:var(--mono);font-weight:500;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut2)}
.case__b p{margin:0;font-size:clamp(13.5px,1.42vw,15.5px);line-height:1.55;color:var(--mut)}
.case__b--win p{color:var(--tx);font-weight:600}
.pipe{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:10px}
.pipe span{
  font-family:var(--mono);font-weight:500;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
  padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--mut);
}
.pipe u{text-decoration:none;color:var(--mut2);font-size:9px}
.blist{list-style:none;margin:0;padding:0}
.blist li{position:relative;padding-left:24px;margin-bottom:12px;font-size:clamp(13.5px,1.4vw,15px);color:var(--mut);line-height:1.55}
.blist li::before{content:"";position:absolute;left:0;top:.6em;width:13px;height:2px;border-radius:2px;background:var(--grad)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:18px}
.tags b{
  font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.03em;
  padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--mut2);
}

/* ==========================================================================
   STACK / PERCURSO / FORMAÇÃO
   ========================================================================== */
.grp{border-top:1px solid var(--line);padding:clamp(20px,2.6vw,32px) 0;display:grid;gap:12px}
@media(min-width:900px){.grp{grid-template-columns:200px 1fr;gap:24px}}
.grp:last-child{border-bottom:1px solid var(--line)}
.grp__h{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;margin:0;color:var(--mut2);padding-top:8px}
.grp__l{display:flex;flex-wrap:wrap;gap:7px}
.grp__l span{
  font-size:clamp(12.5px,1.3vw,14px);font-weight:500;color:var(--mut);
  padding:8px 14px;border:1px solid var(--line);border-radius:999px;transition:.18s var(--ease);
}
.grp__l span:hover{color:var(--tx);border-color:var(--a1);background:color-mix(in srgb,var(--a1) 9%,transparent);transform:translateY(-1px)}

.rail{position:relative;padding-left:clamp(24px,3.4vw,46px)}
.rail__line{position:absolute;left:4px;top:10px;bottom:10px;width:1.5px;border-radius:2px;background:var(--line2)}
.rail__fill{position:absolute;left:4px;top:10px;width:1.5px;border-radius:2px;height:0;background:var(--grad)}
.node{position:relative;padding-bottom:clamp(30px,4.2vw,52px)}
.node:last-child{padding-bottom:0}
.node::before{
  content:"";position:absolute;left:calc(clamp(24px,3.4vw,46px) * -1);top:7px;width:9px;height:9px;border-radius:50%;
  background:var(--bg);border:2px solid var(--a1);
}
.node__d{font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut2)}
.node__t{font-family:var(--disp);font-weight:650;font-size:clamp(19px,2.5vw,30px);line-height:1.06;letter-spacing:-.02em;margin:9px 0 5px}
.node__o{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--mut2);margin:0 0 15px}
.node__p{list-style:none;margin:0;padding:0;display:grid;gap:12px;max-width:66ch}
.node__p li{position:relative;padding-left:17px}
.node__p li::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:2px;border-radius:2px;background:var(--line2)}
.node__p b{display:block;font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px;color:var(--mut2)}
.node__p p{margin:0;font-size:clamp(13.5px,1.42vw,15px);color:var(--mut);line-height:1.55}
.fold{max-height:0;overflow:hidden;transition:max-height .6s var(--ease)}

.edu{border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.edu__r{border-bottom:1px solid var(--line);padding:clamp(16px,2.2vw,24px) clamp(16px,2.4vw,26px);display:grid;gap:6px 26px}
.edu__r:last-child{border-bottom:0}
@media(min-width:860px){.edu__r{grid-template-columns:180px 1fr auto;align-items:baseline}}
.edu__d{font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2)}
.edu__t{font-family:var(--disp);font-weight:600;font-size:clamp(15px,1.7vw,19px);letter-spacing:-.01em;line-height:1.3}
.edu__t span{display:block;font-family:var(--sans);font-size:12.5px;font-weight:400;color:var(--mut2);margin-top:4px}
.edu__b{
  font-family:var(--mono);font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  padding:6px 12px;border-radius:999px;background:var(--grad);color:var(--on-a);justify-self:start;white-space:nowrap;
}
.edu__b--q{background:transparent;color:var(--mut2);border:1px solid var(--line2)}
.facts{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}
.fact{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--line);border-radius:999px;color:var(--mut2)}

/* ---- CONTACTO ---- */
.mail{display:inline-block;font-family:var(--disp);font-weight:700;font-size:clamp(22px,5vw,66px);line-height:1.02;letter-spacing:-.03em;word-break:break-word;transition:opacity .2s}
.mail:hover{opacity:.72}
.links{margin-top:clamp(28px,3.6vw,50px);border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.links a{
  display:flex;align-items:baseline;gap:16px;padding:17px clamp(16px,2.4vw,24px);border-bottom:1px solid var(--line);
  font-family:var(--sans);font-weight:600;font-size:14px;transition:background-color .2s,padding-left .28s var(--ease);
}
.links a:last-child{border-bottom:0}
.links a:hover{background:color-mix(in srgb,var(--a1) 6%,transparent);padding-left:clamp(22px,3vw,32px)}
.links em{font-style:normal;font-family:var(--mono);font-weight:500;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut2);width:92px;flex:none}
.links a span{margin-left:auto;color:var(--mut2)}
.end{display:flex;flex-wrap:wrap;gap:9px 22px;margin-top:clamp(28px,3.6vw,48px);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2)}
.end span:last-child{margin-left:auto}

/* ---- PALETA DE COMANDOS ---- */
.fab{
  position:fixed;right:16px;bottom:16px;z-index:75;width:52px;height:52px;border-radius:50%;
  background:var(--grad);color:var(--on-a);display:grid;place-items:center;box-shadow:var(--shadow-lift);
  transition:transform .2s var(--ease);
}
.fab:active{transform:scale(.94)}
@media(min-width:900px){.fab{display:none}}
.cmd{position:fixed;inset:0;z-index:95;display:none;padding:12vh 16px 16px;background:color-mix(in srgb,var(--bg) 55%,rgba(0,0,0,.5));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cmd.is-open{display:block}
.cmd__box{max-width:560px;margin-inline:auto;background:var(--soft);color:var(--tx);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-lift)}
.cmd__in{width:100%;border:0;border-bottom:1px solid var(--line);padding:17px 20px;background:transparent;color:inherit;font-family:var(--sans);font-weight:500;font-size:14.5px;outline:none}
.cmd__in::placeholder{color:var(--mut2)}
.cmd__list{list-style:none;margin:0;padding:6px;max-height:56vh;overflow-y:auto}
.cmd__list li button{width:100%;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:10px;font-family:var(--sans);font-weight:500;font-size:13.5px;transition:background-color .12s}
.cmd__list li.is-sel button,.cmd__list li button:hover{background:color-mix(in srgb,var(--a1) 12%,transparent)}
.cmd__k{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut2)}
.cmd__empty{padding:24px 20px;font-family:var(--sans);font-size:13px;text-align:center;color:var(--mut2)}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:99;
  background:var(--grad);color:var(--on-a);font-family:var(--sans);font-weight:600;font-size:12.5px;
  padding:12px 22px;border-radius:999px;box-shadow:var(--shadow-lift);
  opacity:0;pointer-events:none;transition:.3s var(--ease);
}
.toast.is-on{opacity:1;transform:translate(-50%,0)}
.skip{position:absolute;left:-9999px}
.skip:focus{left:14px;top:14px;z-index:100;background:var(--grad);color:var(--on-a);padding:12px 18px;border-radius:999px;font-family:var(--sans);font-weight:600;font-size:13px}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .up,.w > i{opacity:1;transform:none}
  .aurora i{animation:none}
  .mq__t{animation:none}
}
</style>
</head>
<body>

<a class="skip" href="#work">Skip to content</a>
<div class="grain" aria-hidden="true"></div>
<div class="prog"><i id="prog"></i></div>

<header class="bar">
  <div class="shell bar__in">
    <div class="mark"><i></i><span>Gonçalo Fernandes</span></div>
    <div class="tools">
      <button class="tbtn" id="themeBtn" aria-label="Theme">
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="tbtn only-lg" id="openCmd">⌘K</button>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="en" aria-pressed="true">EN</button>
        <button data-lang="pt" aria-pressed="false">PT</button>
      </div>
    </div>
  </div>
</header>

<nav class="railnav" id="railnav" aria-label="Sections"></nav>

<main>

  <section class="hero shell" id="hero" data-nav="s_hero">
    <div class="aurora" aria-hidden="true"><i class="b1"></i><i class="b2"></i></div>
    <div class="hero__in" id="heroInner">
      <p class="hero__meta" id="heroMeta"></p>
      <h1 class="display hero__name"><em id="n1">Gonçalo</em><em id="n2">Fernandes</em></h1>
      <p class="hero__lede" id="heroLede"></p>
      <div class="cta up" id="heroCta"></div>
    </div>
    <div class="cue"><i></i><span id="cue">Scroll</span></div>
  </section>

  <div class="mq" aria-hidden="true"><div class="mq__t" id="mq"></div></div>

  <section class="sec shell" id="numbers" data-nav="s_numbers">
    <p class="eyebrow" data-i="eb_numbers"></p>
    <h2 data-i="h_numbers" data-split></h2>
    <div class="nums" id="nums"></div>
  </section>

  <section class="sec shell" id="extraction" data-nav="s_extraction">
    <p class="eyebrow" data-i="eb_extraction"></p>
    <h2 data-i="h_extraction" data-split></h2>
    <p class="lede" data-i="l_extraction"></p>

    <div class="ctrl">
      <span class="ctrl__l" data-i="c_doc"></span>
      <div class="seg" id="docSeg"></div>
      <div class="seg" id="modelSeg"></div>
      <button class="btn btn--fill" id="runX"></button>
    </div>

    <div class="lab">
      <div class="panel">
        <div class="panel__h"><b data-i="p_input"></b><span id="docName"></span></div>
        <div class="panel__b docx" id="docx"><span class="scan" id="scan"></span></div>
      </div>
      <div class="panel">
        <div class="panel__h"><b data-i="p_output"></b><span id="xState"></span></div>
        <div class="panel__b">
          <div class="stages" id="stages"></div>
          <div class="route" id="route"></div>
          <div class="json"><div class="jdim">{</div><div id="jlines"></div><div class="jdim">}</div></div>
          <div class="tally" id="tally"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="sec shell" id="work" data-nav="s_work">
    <p class="eyebrow" data-i="eb_work"></p>
    <h2 data-i="h_work" data-split></h2>
    <p class="lede" data-i="l_work"></p>
    <div class="rows" id="rows"></div>
  </section>

  <section class="sec shell" id="detection" data-nav="s_detection">
    <p class="eyebrow" data-i="eb_detection"></p>
    <h2 data-i="h_detection" data-split></h2>
    <p class="lede" data-i="l_detection"></p>

    <div class="ctrl">
      <span class="ctrl__l" data-i="c_thr"></span>
      <button class="btn btn--fill" id="runS"></button>
      <label class="sliderwrap"><span data-i="c_conf"></span>
        <input class="slider" id="thr" type="range" min="25" max="90" value="45" step="5">
        <output id="thrOut">0,45</output>
      </label>
      <div class="seg" id="clsSeg"></div>
    </div>

    <div class="lab">
      <div class="panel">
        <div class="panel__h"><b data-i="p_frame"></b><span id="frameName"></span></div>
        <div class="panel__b"><div class="rack" id="rack"></div><p class="hint" id="hint"></p></div>
      </div>
      <div class="panel">
        <div class="panel__h"><b data-i="p_report"></b><span id="sState"></span></div>
        <div class="panel__b">
          <div class="readout" id="readout"></div>
          <div class="fills" id="fills"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="sec shell" id="stack" data-nav="s_stack">
    <p class="eyebrow" data-i="eb_stack"></p>
    <h2 data-i="h_stack" data-split></h2>
    <div id="stackList"></div>
  </section>

  <section class="sec shell" id="path" data-nav="s_path">
    <p class="eyebrow" data-i="eb_path"></p>
    <h2 data-i="h_path" data-split></h2>
    <div class="rail" id="rail">
      <span class="rail__line"></span><span class="rail__fill" id="railFill"></span>
      <div id="railNow"></div>
      <div class="fold" id="fold"><div id="railOld"></div></div>
    </div>
    <button class="btn" id="foldBtn" style="margin-top:24px" aria-expanded="false"></button>
  </section>

  <section class="sec shell" id="education" data-nav="s_education">
    <p class="eyebrow" data-i="eb_edu"></p>
    <h2 data-i="h_edu" data-split></h2>
    <div class="edu" id="edu"></div>
    <div class="facts" id="facts"></div>

let lang = (navigator.language || "en").toLowerCase().indexOf("pt") === 0 ? "pt" : "en";
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const fine = window.matchMedia("(pointer: fine)").matches && !reduce;
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const t  = k => (T[lang] && T[lang][k] !== undefined) ? T[lang][k] : k;
const L  = o => (o && typeof o === "object" && !Array.isArray(o)) ? (o[lang] !== undefined ? o[lang] : o) : o;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const dec = n => (lang === "pt" ? n.toFixed(2).replace(".", ",") : n.toFixed(2));

function fmtNum(v, m){
  const sep = lang === "pt" ? "." : ",";
  let s = String(Math.round(v));
  if (m && m.fmt === "thou") s = s.replace(/\B(?=(\d{3})+(?!\d))/g, sep);
  return ((m && m.prefix) || "") + s + ((m && m.suffix) || "");
}

function splitWords(el){
  const words = (el.dataset.raw || el.textContent).trim().split(/\s+/);
  el.dataset.raw = words.join(" ");
  el.innerHTML = words.map((w, i) => '<span class="w" style="--n:' + i + '"><i>' + esc(w) + '</i></span>').join(" ");
}

let rotIdx = 0, rotTimer = null;

function startRotator(){
  if (rotTimer) { clearInterval(rotTimer); rotTimer = null; }
  const el = $("#rotT");
  if (!el) return;
  const words = ROT[lang];
  rotIdx = 0;
  el.textContent = words[0];
  if (reduce || words.length < 2) return;
  rotTimer = setInterval(() => {
    el.classList.add("is-out");
    setTimeout(() => {
      rotIdx = (rotIdx + 1) % words.length;
      el.textContent = words[rotIdx];
      el.classList.remove("is-out");
      el.classList.add("is-prep");
      void el.offsetWidth;
      el.classList.remove("is-prep");
    }, 440);
  }, 2800);
}

let docKey = "util";

function clearX(){ xTimers.forEach(clearTimeout); xTimers = []; }

function renderDoc(){

  $("#route").classList.remove("is-on");
  $("#jlines").innerHTML = "";
  $("#tally").innerHTML = "";
  $("#tally").classList.remove("is-on");
  $("#xState").textContent = t("x_idle");
}

function activeFields(){
  const d = DOCS[docKey];
  return d.rows.filter(r => r.key).map(r => ({
    key:r.key,
    v:r.v,
    conf: useCustom ? r.conf : r.gen
  })).filter(f => useCustom ? true : f.conf >= 0.65);
}

function drawXBoxes(stagger){
  const host = $("#docx");
  $$(".bbox", host).forEach(b => b.remove());
  const anchor = host.getBoundingClientRect();
  const keys = {};
  activeFields().forEach(f => { keys[f.key] = f.conf; });
  const made = [];

  $$(".dv", host).forEach(el => {
    const k = el.dataset.field;
    if (keys[k] === undefined) return;
    const rects = el.getClientRects();
    for (let i = 0; i < rects.length; i++) {
      const r = rects[i];
      const b = document.createElement("div");
      b.className = "bbox";
      b.dataset.field = k;
      b.style.left   = (r.left - anchor.left + host.scrollLeft - 4) + "px";
      b.style.top    = (r.top - anchor.top + host.scrollTop - 2) + "px";
      b.style.width  = (r.width + 8) + "px";
      b.style.height = (r.height + 4) + "px";
      if (i === 0) b.innerHTML = '<span class="bbox__tag">' + k + " " + dec(keys[k]) + '</span>';
      host.appendChild(b);
      made.push(b);
    }
  });

  if (!stagger || reduce) made.forEach(b => b.classList.add("is-in"));
  else made.forEach((b, i) => later(() => b.classList.add("is-in"), i * 95));
  return made.length;
}

function runExtraction(){
  clearX();
  const d = DOCS[docKey];
  const f = activeFields();
  const stages = $$("#stages .stage");
  stages.forEach(s => s.classList.remove("is-on"));
  $("#jlines").innerHTML = "";
  $("#route").classList.remove("is-on");
  $("#tally").classList.remove("is-on");
  $$(".bbox", $("#docx")).forEach(b => b.remove());
  $("#xState").textContent = t("x_run");
  $("#runX").textContent = t("rerun");

  const scan = $("#scan");
  if (scan && !reduce) { scan.classList.remove("is-on"); void scan.offsetWidth; scan.classList.add("is-on"); }

  const step = reduce ? 0 : 120;
  stages.forEach((s, i) => later(() => s.classList.add("is-on"), 120 + i * step));

  later(() => {
    $("#route").innerHTML =
      '<b>' + t("model") + ':</b> ' + esc(useCustom ? d.model : "Generic OCR") + '<br>' +
      esc(useCustom ? L(d.route) : (lang === "pt" ? "sem registo de fornecedor / sem routing / extracção genérica"
                                                 : "no supplier registry / no routing / generic extraction"));
    $("#route").classList.add("is-on");
  }, reduce ? 0 : 380);

  later(() => drawXBoxes(true), reduce ? 0 : 620);

  f.forEach((x, i) => later(() => {
    const el = document.createElement("div");
    el.className = "jline";
    el.dataset.field = x.key;
    el.style.setProperty("--w", Math.round(x.conf * 100) + "%");
    el.innerHTML = '<span><span class="jkey">"' + x.key + '"</span><span class="jdim">: </span>"' +
                   esc(x.v) + '"<span class="jdim">,</span></span>' +
                   '<span class="jconf">' + dec(x.conf) + '<span class="jbar"><i></i></span></span>';
    $("#jlines").appendChild(el);
    requestAnimationFrame(() => el.classList.add("is-in"));
    wireXLink();
  }, (reduce ? 0 : 760) + i * (reduce ? 0 : 105)));

  later(() => {
    const total = d.rows.filter(r => r.key).length;
    const avg = f.length ? f.reduce((a, b) => a + b.conf, 0) / f.length : 0;
    $("#tally").innerHTML =
      '<span><b>' + f.length + "/" + total + '</b> ' + t("fields") + '</span>' +
      '<span><b>' + dec(avg) + '</b> ' + t("avgconf") + '</span>' +
      (useCustom ? "" : '<span><b>' + (total - f.length) + '</b> ' + t("missed") + '</span>');
    $("#tally").classList.add("is-on");
    $("#xState").textContent = t("x_done");
  }, (reduce ? 0 : 760) + f.length * (reduce ? 0 : 105) + 260);
}

function wireXLink(){
  const lit = (k, on) => $$('[data-field="' + k + '"]').forEach(el => el.classList.toggle("is-lit", on));
  $$("#jlines .jline").forEach(j => {
    if (j.dataset.wired) return;
    j.dataset.wired = "1";
    j.addEventListener("mouseenter", () => lit(j.dataset.field, true));
    j.addEventListener("mouseleave", () => lit(j.dataset.field, false));
  });
}

/* ==========================================================================
   10. LABORATÓRIO 2 - DETECÇÃO
   ========================================================================== */

let thr = 0.45;
let clsOn = { box:true, clothing:true, footwear:true, empty_space:true };
let sTimers = [];

function clearS(){ sTimers.forEach(clearTimeout); sTimers = []; }

function paintSlider(){
  const p = Math.round((thr - 0.25) / (0.90 - 0.25) * 100);
  $("#thr").style.background = "linear-gradient(90deg,var(--a1) " + p + "%,var(--line2) " + p + "%)";
}

function renderSControls(){
  $("#runS").textContent = t("scan");
  $("#thrOut").textContent = dec(thr);
  paintSlider();
  $("#clsSeg").innerHTML = CLASSES.map(c =>
    '<button type="button" data-cls="' + c + '" aria-pressed="' + clsOn[c] + '">' + c + '</button>'
  ).join("");
  $$("#clsSeg button").forEach(b => b.addEventListener("click", () => {
    clsOn[b.dataset.cls] = !clsOn[b.dataset.cls];
    b.setAttribute("aria-pressed", String(clsOn[b.dataset.cls]));
    applyThreshold();
  }));
}

function renderRack(){
  $("#frameName").textContent = "ZONE_G / RACK 04";
  $("#rack").innerHTML = RACK.map(level =>
    '<div class="lvl"><span class="lvl__k">' + level.lvl + '</span><div class="bins">' +
      level.bins.map((bin, bi) =>
        '<div class="bin" data-bin="' + level.lvl + bi + '">' +
          bin.map((d, di) => {
            const cls = d[0], conf = d[1], w = d[2];
            const mod = cls === "empty_space" ? " det--empty"
                      : cls === "clothing" ? " det--thin"
                      : cls === "footwear" ? " det--dot" : "";
            return '<span class="det' + mod + '" data-cls="' + cls + '" data-conf="' + conf +
                   '" data-w="' + w + '" data-i="' + di + '" style="flex:0 0 ' + (w * 100) + '%"></span>';
          }).join("") +
        '</div>'
      ).join("") +
    '</div></div>'
  ).join("");

  $("#hint").textContent = t("det_hover");
  $$("#rack .det").forEach(d => {
    d.addEventListener("mouseenter", () => {
      $("#hint").textContent = d.dataset.cls + "  conf " + dec(Number(d.dataset.conf)) +
        "  bin " + d.parentNode.dataset.bin;
    });
    d.addEventListener("mouseleave", () => { $("#hint").textContent = t("det_hover"); });
  });
}

function fillLabel(pct){
  for (let i = 0; i < FILL_LEVELS.length; i++) if (pct >= FILL_LEVELS[i].min) return L(FILL_LEVELS[i]);
  return L(FILL_LEVELS[FILL_LEVELS.length - 1]);
}

function readRow(k, v){
  return '<div class="readout__r"><span>' + esc(k) + '</span><span>' + v + '</span></div>';
}

function applyThreshold(){
  let shown = 0, hidden = 0, sum = 0, occSum = 0, bins = 0, alerts = 0;
  const fills = [];

  $$("#rack .bin").forEach(bin => {
    let filled = 0;
    $$(".det", bin).forEach(d => {
      const conf = Number(d.dataset.conf);
      const cls = d.dataset.cls;
      const pass = conf >= thr && clsOn[cls];
      d.classList.toggle("is-off", !pass);
      if (pass) {
        shown++; sum += conf;
        if (cls !== "empty_space") filled += Number(d.dataset.w);
      } else if (conf < thr) hidden++;
    });
    const pct = Math.min(100, Math.round(filled * 100));
    occSum += pct; bins++;
    if (pct < 30) alerts++;
    fills.push({ id:bin.dataset.bin, pct:pct });
  });

  const avg = shown ? sum / shown : 0;
  const occ = bins ? Math.round(occSum / bins) : 0;

  $("#readout").innerHTML =
    readRow(t("r_shown"), "<b>" + shown + "</b>") +
    readRow(t("r_hidden"), String(hidden)) +
    readRow(t("r_avg"), dec(avg)) +
    readRow(t("r_occ"), occ + "%") +
    readRow(t("r_alerts"), "<b>" + alerts + "</b>");

  $("#fills").innerHTML = fills.map(f =>
    '<div class="fillrow' + (f.pct < 30 ? " is-alert" : "") + '">' +
      '<span style="min-width:22px">' + f.id + '</span>' +
      '<span class="fillrow__b"><i style="width:' + f.pct + '%"></i></span>' +
      '<span class="fillrow__s">' + esc(fillLabel(f.pct)) + '</span>' +
    '</div>'
  ).join("");

  $("#sState").textContent = t("x_done");
}

function runScan(){
  clearS();
  const dets = $$("#rack .det");
  dets.forEach(d => d.classList.remove("is-on"));
  $("#sState").textContent = t("x_run");
  $("#runS").textContent = t("rescan");
  if (reduce) { dets.forEach(d => d.classList.add("is-on")); applyThreshold(); return; }
  dets.forEach((d, i) => sTimers.push(setTimeout(() => d.classList.add("is-on"), 60 + i * 26)));
  sTimers.push(setTimeout(applyThreshold, 60 + dets.length * 26 + 120));
}

/* ==========================================================================
   11. SCROLL - navspy, revelacoes, contadores, parallax, barra
   ========================================================================== */

function wireNavSpy(){
  const io = new IntersectionObserver(es => {
    es.forEach(e => {
      if (!e.isIntersecting) return;
      $$("#railnav button").forEach(b => b.setAttribute("aria-current", String(b.dataset.go === "#" + e.target.id)));
    });
  }, { rootMargin:"-45% 0px -45% 0px", threshold:0 });
  $$("[data-nav]").forEach(s => io.observe(s));
}

let labsStarted = { x:false, s:false };

function wireReveal(){
  const io = new IntersectionObserver(es => {
    es.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.classList.add("is-in");
      io.unobserve(e.target);
      if (e.target.id === "extraction" && !labsStarted.x) { labsStarted.x = true; setTimeout(runExtraction, reduce ? 0 : 260); }
      if (e.target.id === "detection"  && !labsStarted.s) { labsStarted.s = true; setTimeout(runScan, reduce ? 0 : 200); }
    });
  }, { threshold:.1, rootMargin:"0px 0px -50px 0px" });

  $$("[data-split]").forEach(el => { splitWords(el); io.observe(el); });
  $$(".up").forEach(el => io.observe(el));
  $$("section, footer").forEach(el => io.observe(el));
}

function wireCounters(){
  $$(".num__n").forEach(el => {
    const m = METRICS[Number(el.dataset.n)];
    if (reduce) { el.textContent = fmtNum(m.value, m); return; }
    let done = false;
    const io = new IntersectionObserver(es => {
      es.forEach(e => {
        if (!e.isIntersecting || done) return;
        done = true;
        const t0 = performance.now(), dur = 1250;
        const step = now => {
          const k = Math.min(1, (now - t0) / dur);
          el.textContent = fmtNum(m.value * (1 - Math.pow(1 - k, 4)), m);
          if (k < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
        io.disconnect();
      });
    }, { threshold:.5 });
    io.observe(el);
  });
}

let lastY = 0;

function onScroll(){
  const h = document.documentElement;
  const y = h.scrollTop || document.body.scrollTop;
  const max = h.scrollHeight - window.innerHeight;
  $("#prog").style.width = (max > 0 ? y / max * 100 : 0) + "%";

  // Barra esconde a descer, volta a subir
  const bar = $(".bar");
  if (y > 160 && y > lastY + 6) bar.classList.add("is-hid");
  else if (y < lastY - 6) bar.classList.remove("is-hid");
  lastY = y;

  // Parallax suave do hero
  const hi = $("#heroInner");
  if (hi && !reduce) {
    const k = Math.min(1, y / 640);
    hi.style.transform = "translateY(" + (y * .16) + "px)";
    hi.style.opacity = String(1 - k * .85);
  }

  // Linha do percurso desenha-se com o scroll
  const rail = $("#rail"), fill = $("#railFill");
  if (rail && fill) {
    const r = rail.getBoundingClientRect();
    const p = Math.max(0, Math.min(1, (window.innerHeight * .72 - r.top) / Math.max(1, r.height)));
    fill.style.height = (p * (r.height - 20)) + "px";
  }
}

/* ==========================================================================
   12. SPOTLIGHT E BOTÕES MAGNÉTICOS (so rato fino, sem reduced motion)
   ========================================================================== */

function wireSpotlight(){
  if (!fine) return;
  $$(".num, .panel").forEach(el => {
    if (el.dataset.glow) return;
    el.dataset.glow = "1";
    el.classList.add("glow");
    el.addEventListener("pointermove", e => {
      const r = el.getBoundingClientRect();
      el.style.setProperty("--mx", (e.clientX - r.left) + "px");
      el.style.setProperty("--my", (e.clientY - r.top) + "px");
    });
  });
}

function wireMagnetic(){
  if (!fine) return;
  $$(".btn").forEach(b => {
    if (b.dataset.mag) return;
    b.dataset.mag = "1";
    b.addEventListener("pointermove", e => {
      const r = b.getBoundingClientRect();
      const dx = (e.clientX - r.left - r.width / 2) / r.width;
      const dy = (e.clientY - r.top - r.height / 2) / r.height;
      b.style.transform = "translate(" + (dx * 6) + "px," + (dy * 6) + "px)";
    });
    b.addEventListener("pointerleave", () => { b.style.transform = ""; });
  });
}

/* ==========================================================================
   13. PALETA DE COMANDOS
   ========================================================================== */

let cmdSel = 0, cmdCur = [];

function cmdItems(){
  const secs = $$("[data-nav]").map(s => ({ label:t(s.dataset.nav), kind:"section", href:"#" + s.id }));
  const projs = PROJECTS.map(p => ({ label:p.title, kind:"project", href:"#work", id:p.id }));
  const acts = [
    { label:t("cmd_lang"), kind:"action", fn:() => setLang(lang === "en" ? "pt" : "en") },
    { label: curTheme() === "light" ? t("cmd_dark") : t("cmd_light"), kind:"action",
      fn:() => setTheme(curTheme() === "light" ? "dark" : "light") },
    { label:t("cmd_copy"), kind:"action", fn:copyEmail },
    { label:"LinkedIn", kind:"link", href:ME.linkedin },
    { label:"GitHub",   kind:"link", href:ME.github }
  ];
  return secs.concat(projs, acts);
}

function cmdRender(q){
  cmdCur = cmdItems().filter(i => i.label.toLowerCase().indexOf(q.toLowerCase()) !== -1);
  cmdSel = 0;
  const list = $("#cmdList");
  if (!cmdCur.length) { list.innerHTML = '<li class="cmd__empty">' + t("cmd_none") + '</li>'; return; }
  list.innerHTML = cmdCur.map((i, n) =>
    '<li class="' + (n === 0 ? "is-sel" : "") + '" data-n="' + n + '"><button type="button">' +
    esc(i.label) + '<span class="cmd__k">' + i.kind + '</span></button></li>'
  ).join("");
  $$("#cmdList li[data-n]").forEach(li => li.addEventListener("click", () => cmdRun(Number(li.dataset.n))));
}

function cmdRun(n){
  const it = cmdCur[n];
  if (!it) return;
  cmdClose();
  if (it.fn) { it.fn(); return; }
  if (it.kind === "link") { window.open(it.href, "_blank", "noopener"); return; }
  const target = $(it.href);
  if (target) target.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block:"start" });
  if (it.id) setTimeout(() => {
    const row = $('.row[data-id="' + it.id + '"]');
    if (!row) return;
    if (!row.classList.contains("is-open")) $(".row__hd", row).click();
    row.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block:"center" });
  }, reduce ? 0 : 520);
}

function cmdMove(d){
  const lis = $$("#cmdList li[data-n]");
  if (!lis.length) return;
  cmdSel = (cmdSel + d + lis.length) % lis.length;
  lis.forEach((li, i) => li.classList.toggle("is-sel", i === cmdSel));
  lis[cmdSel].scrollIntoView({ block:"nearest" });
}

function cmdOpen(){
  $("#cmd").classList.add("is-open");
  document.body.classList.add("is-locked");
  $("#cmdIn").value = "";
  cmdRender("");
  setTimeout(() => $("#cmdIn").focus(), 20);
}
function cmdClose(){
  $("#cmd").classList.remove("is-open");
  document.body.classList.remove("is-locked");
}

function toast(msg){
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("is-on");
  setTimeout(() => el.classList.remove("is-on"), 1900);
}

function copyEmail(){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(ME.email).then(() => toast(t("copy_ok")));
  } else {
    const ta = document.createElement("textarea");
    ta.value = ME.email;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); toast(t("copy_ok")); } catch (e) { /* silencioso */ }
    document.body.removeChild(ta);
  }
}

/* ==========================================================================
   14. LÍNGUA E ARRANQUE
   ========================================================================== */

function renderAll(){
  renderChrome();
  renderNav();
  renderNums();
  renderRows();
  renderStack();
  renderPath();
  renderEdu();
  renderContact();
  renderXControls();
  renderDoc();
  renderSControls();
  renderRack();
}

function setLang(next){
  lang = next;
  try { localStorage.setItem("lang", next); } catch (e) { /* modo privado */ }
  renderAll();
  $$("[data-split]").forEach(el => { splitWords(el); el.classList.add("is-in"); });
  $$(".up").forEach(el => el.classList.add("is-in"));
  wireCounters();
  wireSpotlight();
  wireMagnetic();
  startRotator();
  if (labsStarted.x) runExtraction();
  if (labsStarted.s) {
    $$("#rack .det").forEach(d => d.classList.add("is-on"));
    applyThreshold();
  }
}

function boot(){
  try {
    const sl = localStorage.getItem("lang");
    if (sl === "en" || sl === "pt") lang = sl;
  } catch (e) { /* modo privado */ }

  renderAll();
  wireNavSpy();
  wireReveal();
  wireCounters();
  wireSpotlight();
  wireMagnetic();
  startRotator();

  // Nome: primeira linha letra a letra, segunda linha inteira com gradiente
  const n1 = $("#n1");
  n1.innerHTML = n1.textContent.split("").map((c, i) =>
    '<span class="w" style="--n:' + i + '"><i>' + esc(c) + '</i></span>').join("");
  const n2 = $("#n2");
  n2.innerHTML = '<span class="w" style="--n:8"><i class="gt">' + esc(n2.textContent) + '</i></span>';
  requestAnimationFrame(() => $("#hero").classList.add("is-in"));

  let rt;
  const redraw = () => { clearTimeout(rt); rt = setTimeout(() => { if (labsStarted.x) drawXBoxes(false); }, 160); };
  window.addEventListener("resize", redraw);
  window.addEventListener("orientationchange", redraw);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { if (labsStarted.x) drawXBoxes(false); }).catch(() => {});
  }

  let ticking = false;
  window.addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { onScroll(); ticking = false; });
  }, { passive:true });
  onScroll();

  $("#runX").addEventListener("click", runExtraction);
  $("#runS").addEventListener("click", runScan);
  $("#thr").addEventListener("input", e => {
    thr = Number(e.target.value) / 100;
    $("#thrOut").textContent = dec(thr);
    paintSlider();
    applyThreshold();
  });

  $("#themeBtn").addEventListener("click", () => setTheme(curTheme() === "light" ? "dark" : "light"));
  $$(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

  const fb = $("#foldBtn"), fw = $("#fold");
  fb.addEventListener("click", () => {
    const open = fw.dataset.open !== "1";
    fw.dataset.open = open ? "1" : "0";
    fw.style.maxHeight = open ? fw.scrollHeight + "px" : "0px";
    fb.setAttribute("aria-expanded", String(open));
    fb.textContent = open ? t("fold_hide") : t("fold_show");
    if (open) $$(".up", fw).forEach(el => el.classList.add("is-in"));
  });

  $("#openCmd").addEventListener("click", cmdOpen);
  $("#fab").addEventListener("click", cmdOpen);
  $("#cmd").addEventListener("click", e => { if (e.target.id === "cmd") cmdClose(); });
  $("#cmdIn").addEventListener("input", e => cmdRender(e.target.value));

  document.addEventListener("keydown", e => {
    if ((e.key === "k" || e.key === "K") && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      if ($("#cmd").classList.contains("is-open")) cmdClose(); else cmdOpen();
      return;
    }
    if (!$("#cmd").classList.contains("is-open")) return;
    if (e.key === "Escape")    { e.preventDefault(); cmdClose(); }
    if (e.key === "ArrowDown") { e.preventDefault(); cmdMove(1); }
    if (e.key === "ArrowUp")   { e.preventDefault(); cmdMove(-1); }
    if (e.key === "Enter")     { e.preventDefault(); cmdRun(cmdSel); }
  });
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
